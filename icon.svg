<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1a14"/>
      <stop offset="1" stop-color="#0e0c08"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- 3x3 habit grid: rings (incomplete) + gold filled dots (completed) -->
  <g transform="translate(116 116)" fill="none" stroke-width="14">
    <!-- row 1 -->
    <circle cx="0"   cy="0"   r="34" stroke="#b08d2e" fill="#b08d2e"/>
    <circle cx="140" cy="0"   r="34" stroke="#5b5443"/>
    <circle cx="280" cy="0"   r="34" stroke="#b08d2e" fill="#b08d2e"/>
    <!-- row 2 -->
    <circle cx="0"   cy="140" r="34" stroke="#5b5443"/>
    <circle cx="140" cy="140" r="34" stroke="#b08d2e" fill="#b08d2e"/>
    <circle cx="280" cy="140" r="34" stroke="#b08d2e" fill="#b08d2e"/>
    <!-- row 3 -->
    <circle cx="0"   cy="280" r="34" stroke="#b08d2e" fill="#b08d2e"/>
    <circle cx="140" cy="280" r="34" stroke="#b08d2e" fill="#b08d2e"/>
    <circle cx="280" cy="280" r="34" stroke="#5b5443"/>
  </g>
</svg>
